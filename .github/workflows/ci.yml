name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  NODE_VERSION: '18'
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ${{ github.repository }}/backend
  FRONTEND_IMAGE: ${{ github.repository }}/frontend

jobs:
  # Job 1: Backend CI
  backend-ci:
    name: Backend CI
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test -- --coverage --watchAll=false

      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        with:
          file: ./backend/coverage/coverage-final.json
          flags: backend
          name: backend-coverage
        continue-on-error: true

      - name: Build Docker image
        working-directory: ./
        run: |
          docker build -t ${{ env.BACKEND_IMAGE }}:${{ github.sha }} -t ${{ env.BACKEND_IMAGE }}:latest -f backend/Dockerfile backend

      - name: Test Docker image size
        run: |
          IMAGE_SIZE=$(docker images ${{ env.BACKEND_IMAGE }}:${{ github.sha }} --format "{{.Size}}")
          echo "Backend image size: $IMAGE_SIZE"
          if [[ $(echo "$IMAGE_SIZE" | grep -oE '[0-9]+' | head -1) -gt 200 ]]; then
            echo "⚠️ Warning: Image size exceeds 200MB"
          fi

  # Job 2: Frontend CI
  frontend-ci:
    name: Frontend CI
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test -- --coverage --watchAll=false --ci

      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        with:
          file: ./frontend/coverage/coverage-final.json
          flags: frontend
          name: frontend-coverage
        continue-on-error: true

      - name: Build application
        run: npm run build

      - name: Build Docker image
        working-directory: ./
        run: |
          docker build -t ${{ env.FRONTEND_IMAGE }}:${{ github.sha }} -t ${{ env.FRONTEND_IMAGE }}:latest -f frontend/Dockerfile frontend

      - name: Test Docker image size
        run: |
          IMAGE_SIZE=$(docker images ${{ env.FRONTEND_IMAGE }}:${{ github.sha }} --format "{{.Size}}")
          echo "Frontend image size: $IMAGE_SIZE"

  # Job 3: Code Quality & Linting
  code-quality:
    name: Code Quality Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js (Backend)
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Setup Node.js (Frontend)
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install ESLint (Backend)
        working-directory: ./backend
        run: |
          npm install --save-dev eslint || echo "ESLint not configured"
          npm run lint || echo "No lint script found"

      - name: Install ESLint (Frontend)
        working-directory: ./frontend
        run: |
          npm install --save-dev eslint || echo "ESLint not configured"
          npm run lint || echo "No lint script found"

      - name: Check code formatting
        run: |
          echo "Checking code formatting..."
          # Add prettier check if configured
          # npx prettier --check "**/*.{js,jsx,json,md}" || true

  # Job 4: Dependency Audit
  dependency-audit:
    name: Dependency Security Audit
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        directory: [backend, frontend]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Run npm audit
        working-directory: ./${{ matrix.directory }}
        run: |
          npm audit --audit-level=moderate || true
          npm audit --json > audit-report-${{ matrix.directory }}.json || true

      - name: Upload audit reports
        uses: actions/upload-artifact@v4
        with:
          name: audit-report-${{ matrix.directory }}
          path: ${{ matrix.directory }}/audit-report-${{ matrix.directory }}.json
        continue-on-error: true

  # Job 5: Security Scanning
  security-scan:
    name: Security Scan (Trivy)
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner (Filesystem)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: 'trivy-results.sarif'
        continue-on-error: true

      - name: Scan Docker images
        run: |
          docker build -t test-backend:scan -f backend/Dockerfile backend || true
          docker build -t test-frontend:scan -f frontend/Dockerfile frontend || true

      - name: Run Trivy on Docker images
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'test-backend:scan'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'
        continue-on-error: true

  # Job 6: Integration Tests
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Start backend container
        run: |
          cd backend
          docker build -t test-backend .
          docker run -d -p 5000:5000 --name backend test-backend
          sleep 5

      - name: Run integration tests
        run: |
          cd backend
          npm install
          npm test -- tests/integration.test.js || echo "Integration tests not yet implemented"

      - name: Cleanup
        if: always()
        run: |
          docker stop backend || true
          docker rm backend || true

  # Job 7: Performance Testing
  performance-tests:
    name: Performance Tests
    runs-on: ubuntu-latest
    needs: [backend-ci]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Start backend
        run: |
          cd backend
          docker build -t perf-backend .
          docker run -d -p 5000:5000 --name perf-backend perf-backend
          sleep 5

      - name: Install Apache Bench
        run: sudo apt-get update && sudo apt-get install -y apache2-utils

      - name: Run performance tests
        run: |
          echo "Running performance tests..."
          ab -n 1000 -c 10 http://localhost:5000/health || echo "Performance tests completed"
          ab -n 500 -c 5 http://localhost:5000/sales || echo "Sales endpoint tested"

      - name: Cleanup
        if: always()
        run: |
          docker stop perf-backend || true
          docker rm perf-backend || true

  # Job 8: Documentation Check
  documentation-check:
    name: Documentation Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check README exists
        run: |
          test -f README.md && echo "✅ README.md exists" || echo "❌ README.md missing"
          test -f docs/DEVOPS_ROADMAP.md && echo "✅ DevOps roadmap exists" || echo "⚠️ DevOps roadmap missing"

      - name: Check documentation completeness
        run: |
          echo "Checking documentation files..."
          ls -la docs/ || echo "No docs directory"
          echo "Documentation check completed"

      - name: Validate markdown
        uses: DavidAnson/markdownlint-cli2-action@v15
        with:
          globs: "**/*.md"
        continue-on-error: true

  # Job 9: Docker Build Validation
  docker-build-validation:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        service: [backend, frontend]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service }}
          file: ./${{ matrix.service }}/Dockerfile
          push: false
          load: true
          tags: test-${{ matrix.service }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Inspect image
        run: |
          if docker images test-${{ matrix.service }}:latest | grep -q test-${{ matrix.service }}; then
            echo "✅ Image found"
            docker images test-${{ matrix.service }}:latest
            docker history test-${{ matrix.service }}:latest
          else
            echo "⚠️ Image not found in local Docker daemon"
            echo "This may happen if the build failed or image wasn't loaded"
          fi

      - name: Test image health
        run: |
          PORT=${{ matrix.service == 'backend' && '5000' || '80' }}
          docker run -d --name test-${{ matrix.service }} -p 8080:$PORT test-${{ matrix.service }}:latest || true
          sleep 3
          docker ps -a | grep test-${{ matrix.service }} || true
          docker stop test-${{ matrix.service }} || true
          docker rm test-${{ matrix.service }} || true

  # Job 10: License Check
  license-check:
    name: License Compliance Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install license checker
        run: npm install -g license-checker

      - name: Check backend licenses
        working-directory: ./backend
        run: |
          npm install
          license-checker --onlyAllow "MIT;Apache-2.0;BSD-2-Clause;BSD-3-Clause;ISC" || echo "License check completed"
        continue-on-error: true

      - name: Check frontend licenses
        working-directory: ./frontend
        run: |
          npm install
          license-checker --onlyAllow "MIT;Apache-2.0;BSD-2-Clause;BSD-3-Clause;ISC" || echo "License check completed"
        continue-on-error: true

  # Job 11: Code Analysis
  code-analysis:
    name: Static Code Analysis
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install SonarQube Scanner
        run: |
          wget https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-4.8.0.2856-linux.zip
          unzip sonar-scanner-cli-4.8.0.2856-linux.zip
          sudo mv sonar-scanner-4.8.0.2856-linux /opt/sonar-scanner
          echo "$GITHUB_WORKSPACE/opt/sonar-scanner/bin" >> $GITHUB_PATH
        continue-on-error: true

      - name: Run code complexity check
        working-directory: ./backend
        run: |
          npm install
          npx complexity-report --format json . > complexity-report.json || echo "Complexity check completed"
        continue-on-error: true

      - name: Check for code smells
        run: |
          echo "Running code smell detection..."
          # Add custom code smell checks here
          echo "Code analysis completed"

  # Job 12: Build Artifacts
  build-artifacts:
    name: Build Artifacts
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build backend
        working-directory: ./backend
        run: |
          npm install
          npm test -- --coverage --watchAll=false

      - name: Build frontend
        working-directory: ./frontend
        run: |
          npm install
          npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            frontend/build
            backend/coverage
          retention-days: 7

  # Job 13: E2E Tests (Placeholder)
  e2e-tests:
    name: End-to-End Tests
    runs-on: ubuntu-latest
    needs: [integration-tests]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Start services
        run: |
          echo "Starting services for E2E tests..."
          # Add Playwright/Cypress setup here

      - name: Run E2E tests
        run: |
          echo "E2E tests would run here"
          echo "Consider adding Playwright or Cypress for E2E testing"

  # Job 14: Docker Image Vulnerability Scanning
  docker-image-scan:
    name: Docker Image Vulnerability Scan
    runs-on: ubuntu-latest
    needs: [docker-build-validation]
    
    strategy:
      matrix:
        service: [backend, frontend]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service }}
          file: ./${{ matrix.service }}/Dockerfile
          push: false
          load: true
          tags: scan-${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy vulnerability scanner on image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'scan-${{ matrix.service }}:${{ github.sha }}'
          format: 'sarif'
          output: 'trivy-image-${{ matrix.service }}.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: 'trivy-image-${{ matrix.service }}.sarif'
        continue-on-error: true

      - name: Generate vulnerability report
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy image --format table scan-${{ matrix.service }}:${{ github.sha }} || true

  # Job 15: Docker Image Optimization Check
  docker-image-optimization:
    name: Docker Image Optimization
    runs-on: ubuntu-latest
    needs: [docker-build-validation]
    
    strategy:
      matrix:
        service: [backend, frontend]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service }}
          file: ./${{ matrix.service }}/Dockerfile
          push: false
          load: true
          tags: opt-${{ matrix.service }}:${{ github.sha }}

      - name: Analyze image layers
        run: |
          echo "Analyzing Docker image layers..."
          if docker images opt-${{ matrix.service }}:${{ github.sha }} | grep -q opt-${{ matrix.service }}; then
            docker history opt-${{ matrix.service }}:${{ github.sha }} --format "table {{.CreatedBy}}\t{{.Size}}" > layer-analysis-${{ matrix.service }}.txt
            cat layer-analysis-${{ matrix.service }}.txt
          else
            echo "⚠️ Image not found, skipping layer analysis"
          fi

      - name: Check image size
        run: |
          if docker images opt-${{ matrix.service }}:${{ github.sha }} | grep -q opt-${{ matrix.service }}; then
            IMAGE_SIZE=$(docker images opt-${{ matrix.service }}:${{ github.sha }} --format "{{.Size}}")
            echo "Image size: $IMAGE_SIZE"
            echo "Size check completed"
          else
            echo "⚠️ Image not found, skipping size check"
          fi

      - name: Check for multi-stage builds
        run: |
          if grep -q "FROM.*AS" ./${{ matrix.service }}/Dockerfile; then
            echo "✅ Multi-stage build detected"
          else
            echo "⚠️ Consider using multi-stage builds for optimization"
          fi

      - name: Check base image
        run: |
          BASE_IMAGE=$(grep "^FROM" ./${{ matrix.service }}/Dockerfile | head -1 | awk '{print $2}')
          echo "Base image: $BASE_IMAGE"
          if echo "$BASE_IMAGE" | grep -q "alpine"; then
            echo "✅ Using Alpine base image (optimized)"
          else
            echo "ℹ️ Consider using Alpine for smaller image size"
          fi

  # Job 16: Docker Multi-Architecture Build
  docker-multiarch-build:
    name: Docker Multi-Architecture Build
    runs-on: ubuntu-latest
    needs: [docker-build-validation]
    
    strategy:
      matrix:
        service: [backend, frontend]
        platform: [linux/amd64, linux/arm64]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build for ${{ matrix.platform }}
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service }}
          file: ./${{ matrix.service }}/Dockerfile
          push: false
          tags: multiarch-${{ matrix.service }}:${{ matrix.platform }}
          platforms: ${{ matrix.platform }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify architecture
        run: |
          echo "Built image for platform: ${{ matrix.platform }}"
          echo "Note: Multi-arch images cannot be loaded into local Docker daemon"
          echo "Image built successfully for ${{ matrix.platform }}"

  # Job 17: Docker Image Layer Analysis
  docker-layer-analysis:
    name: Docker Layer Analysis
    runs-on: ubuntu-latest
    needs: [docker-build-validation]
    
    strategy:
      matrix:
        service: [backend, frontend]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service }}
          file: ./${{ matrix.service }}/Dockerfile
          push: false
          load: true
          tags: layer-${{ matrix.service }}:${{ github.sha }}

      - name: Analyze layer sizes
        run: |
          echo "=== Layer Size Analysis for ${{ matrix.service }} ==="
          if docker images layer-${{ matrix.service }}:${{ github.sha }} | grep -q layer-${{ matrix.service }}; then
            docker history layer-${{ matrix.service }}:${{ github.sha }} --human --format "{{.Size}}\t{{.CreatedBy}}" | head -20
          else
            echo "⚠️ Image not found, skipping layer analysis"
          fi

      - name: Count layers
        run: |
          if docker images layer-${{ matrix.service }}:${{ github.sha }} | grep -q layer-${{ matrix.service }}; then
            LAYER_COUNT=$(docker history layer-${{ matrix.service }}:${{ github.sha }} --format "{{.ID}}" | wc -l)
            echo "Total layers: $LAYER_COUNT"
            if [ "$LAYER_COUNT" -gt 20 ]; then
              echo "⚠️ High layer count. Consider combining RUN commands"
            else
              echo "✅ Layer count is reasonable"
            fi
          else
            echo "⚠️ Image not found, skipping layer count"
          fi

      - name: Check for unnecessary files
        run: |
          echo "Checking for common unnecessary files..."
          docker run --rm layer-${{ matrix.service }}:${{ github.sha }} find / -name "*.md" -o -name "*.txt" -o -name ".git" 2>/dev/null | head -10 || echo "No unnecessary files found"

  # Job 18: Docker Image Metadata Validation
  docker-metadata-validation:
    name: Docker Image Metadata
    runs-on: ubuntu-latest
    needs: [docker-build-validation]
    
    strategy:
      matrix:
        service: [backend, frontend]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service }}
          file: ./${{ matrix.service }}/Dockerfile
          push: false
          load: true
          tags: meta-${{ matrix.service }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.title=${{ matrix.service }}
            org.opencontainers.image.version=${{ github.sha }}
            org.opencontainers.image.created=${{ github.event.head_commit.timestamp }}
            org.opencontainers.image.source=${{ github.repositoryUrl }}

      - name: Inspect image metadata
        run: |
          echo "=== Image Metadata for ${{ matrix.service }} ==="
          if docker images meta-${{ matrix.service }}:${{ github.sha }} | grep -q meta-${{ matrix.service }}; then
            docker inspect meta-${{ matrix.service }}:${{ github.sha }} | jq '.[0].Config.Labels' || docker inspect meta-${{ matrix.service }}:${{ github.sha }}
          else
            echo "⚠️ Image not found, skipping metadata inspection"
          fi

      - name: Check image labels
        run: |
          if docker images meta-${{ matrix.service }}:${{ github.sha }} | grep -q meta-${{ matrix.service }}; then
            LABELS=$(docker inspect meta-${{ matrix.service }}:${{ github.sha }} --format='{{json .Config.Labels}}')
            echo "Image labels: $LABELS"
            if [ -z "$LABELS" ] || [ "$LABELS" = "null" ]; then
              echo "⚠️ No labels found. Consider adding metadata labels"
            else
              echo "✅ Image has labels"
            fi
          else
            echo "⚠️ Image not found, skipping label check"
          fi

      - name: Verify image architecture
        run: |
          if docker images meta-${{ matrix.service }}:${{ github.sha }} | grep -q meta-${{ matrix.service }}; then
            ARCH=$(docker inspect meta-${{ matrix.service }}:${{ github.sha }} --format='{{.Architecture}}')
            OS=$(docker inspect meta-${{ matrix.service }}:${{ github.sha }} --format='{{.Os}}')
            echo "Architecture: $ARCH"
            echo "OS: $OS"
          else
            echo "⚠️ Image not found, skipping architecture check"
          fi

  # Job 19: Docker Compose Validation
  docker-compose-validation:
    name: Docker Compose Validation
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for docker-compose.yml
        run: |
          if [ -f "docker-compose.yml" ] || [ -f "docker-compose.yaml" ]; then
            echo "✅ Docker Compose file found"
          else
            echo "ℹ️ No docker-compose.yml found (optional)"
            exit 0
          fi

      - name: Validate docker-compose syntax
        run: |
          if [ -f "docker-compose.yml" ] || [ -f "docker-compose.yaml" ]; then
            docker compose config --quiet || echo "Docker Compose validation completed"
          fi
        continue-on-error: true

      - name: Check docker-compose services
        run: |
          if [ -f "docker-compose.yml" ] || [ -f "docker-compose.yaml" ]; then
            docker compose config --services || echo "Services check completed"
          fi
        continue-on-error: true

  # Job 20: Docker Image Size Optimization
  docker-size-optimization:
    name: Docker Image Size Optimization
    runs-on: ubuntu-latest
    needs: [docker-image-optimization]
    
    strategy:
      matrix:
        service: [backend, frontend]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build optimized image
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service }}
          file: ./${{ matrix.service }}/Dockerfile
          push: false
          load: true
          tags: optimized-${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Calculate image size
        run: |
          if docker images optimized-${{ matrix.service }}:${{ github.sha }} | grep -q optimized-${{ matrix.service }}; then
            IMAGE_SIZE=$(docker images optimized-${{ matrix.service }}:${{ github.sha }} --format "{{.Size}}")
            echo "Image size: $IMAGE_SIZE"
            echo "IMAGE_SIZE=$IMAGE_SIZE" >> $GITHUB_ENV
          else
            echo "⚠️ Image not found, skipping size calculation"
            echo "IMAGE_SIZE=unknown" >> $GITHUB_ENV
          fi

      - name: Size optimization recommendations
        run: |
          echo "Image size analysis for ${{ matrix.service }}:"
          echo "Current size: ${IMAGE_SIZE}"
          echo ""
          echo "Optimization checklist:"
          echo "✅ Multi-stage builds: $(grep -q 'FROM.*AS' ./${{ matrix.service }}/Dockerfile && echo 'Yes' || echo 'No')"
          echo "✅ Alpine base: $(grep -q 'alpine' ./${{ matrix.service }}/Dockerfile && echo 'Yes' || echo 'No')"
          echo "✅ .dockerignore: $([ -f ./${{ matrix.service }}/.dockerignore ] && echo 'Yes' || echo 'No')"
          echo ""
          if echo "${IMAGE_SIZE}" | grep -qE '[0-9]+[MG]B' && [ "$(echo "${IMAGE_SIZE}" | grep -oE '[0-9]+' | head -1)" -gt 200 ]; then
            echo "⚠️ Image size exceeds 200MB - consider optimization"
            echo "Recommendations:"
            echo "1. Use multi-stage builds"
            echo "2. Use Alpine base images"
            echo "3. Remove unnecessary files"
            echo "4. Combine RUN commands"
            echo "5. Use .dockerignore"
          else
            echo "✅ Image size appears optimized"
          fi

      - name: Check .dockerignore usage
        run: |
          if [ -f "./${{ matrix.service }}/.dockerignore" ]; then
            echo "✅ .dockerignore file exists"
            echo "Ignored patterns:"
            cat ./${{ matrix.service }}/.dockerignore | head -10
          else
            echo "⚠️ Consider adding .dockerignore to reduce build context"
          fi

  # Job 21: Docker Image Health Check
  docker-health-check:
    name: Docker Image Health Check
    runs-on: ubuntu-latest
    needs: [docker-build-validation]
    
    strategy:
      matrix:
        service: [backend, frontend]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service }}
          file: ./${{ matrix.service }}/Dockerfile
          push: false
          load: true
          tags: health-${{ matrix.service }}:${{ github.sha }}

      - name: Check HEALTHCHECK instruction
        run: |
          if grep -q "HEALTHCHECK" ./${{ matrix.service }}/Dockerfile; then
            echo "✅ HEALTHCHECK instruction found"
            grep "HEALTHCHECK" ./${{ matrix.service }}/Dockerfile
          else
            echo "⚠️ No HEALTHCHECK instruction found. Consider adding one for better monitoring"
          fi

      - name: Test container startup
        run: |
          PORT=${{ matrix.service == 'backend' && '5000' || '80' }}
          docker run -d --name test-${{ matrix.service }} -p $PORT:$PORT health-${{ matrix.service }}:${{ github.sha }} || true
          sleep 5
          docker ps -a | grep test-${{ matrix.service }} || true

      - name: Test health endpoint (backend only)
        if: matrix.service == 'backend'
        run: |
          sleep 3
          curl -f http://localhost:5000/health || echo "Health check endpoint test completed"
        continue-on-error: true

      - name: Cleanup
        if: always()
        run: |
          docker stop test-${{ matrix.service }} || true
          docker rm test-${{ matrix.service }} || true

  # Job 22: Notify on failure
  notify:
    name: Notify on Failure
    runs-on: ubuntu-latest
    needs: [
      backend-ci,
      frontend-ci,
      code-quality,
      dependency-audit,
      security-scan,
      integration-tests,
      performance-tests,
      documentation-check,
      docker-build-validation,
      license-check,
      code-analysis,
      build-artifacts,
      docker-image-scan,
      docker-image-optimization,
      docker-multiarch-build,
      docker-layer-analysis,
      docker-metadata-validation,
      docker-compose-validation,
      docker-size-optimization,
      docker-health-check
    ]
    if: failure()
    
    steps:
      - name: Notify failure
        run: |
          echo "❌ CI Pipeline failed!"
          echo "Check the workflow run for details: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          # Add Slack/Email notification here if configured
          # Example: curl -X POST -H 'Content-type: application/json' --data '{"text":"CI Pipeline failed!"}' $SLACK_WEBHOOK_URL
